services:
  db:
    image: postgres:15-alpine
    container_name: crediflow_db
    restart: always
    environment:
      POSTGRES_USER: crediflow_user
      POSTGRES_PASSWORD: crediflow_password
      POSTGRES_DB: crediflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crediflow_user -d crediflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crediflow_backend
    restart: always
    ports:
      - "8000:8000"
    # Your secret keys live in backend/.env (never committed to git).
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://crediflow_user:crediflow_password@db:5432/crediflow
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/models:/app/models

volumes:
  postgres_data:
